[project]
name = "trust_compliance"
authors = [{ name = "Praveen Vemula", email = "vemula78@gmail.com" }]
description = "Fund accounting, 80G receipting, FCRA segregation and donated-property management for Indian charitable trusts, on ERPNext."
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = []

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.flit.module]
name = "trust_compliance"

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["F", "E", "W", "I", "UP", "B", "RUF"]
ignore = ["B017", "E101", "E402", "E501", "W191", "RUF001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
